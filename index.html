<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Movie Grade Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #05070b; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: #0f1420; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #1e293b; }
        h1 { font-size: 1.3rem; text-align: center; margin-bottom: 20px; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        
        .upload-box { border: 2px dashed #334155; border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; background: #090d16; margin-bottom: 20px; transition: 0.3s; }
        .upload-box:hover { border-color: #38bdf8; }
        
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 20px; display: none; box-shadow: 0 8px 20px rgba(0,0,0,0.8); }
        video, canvas { width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0; }
        
        /* Movie Letterbox Bars (Anamorphic Effect) */
        .letterbox-top, .letterbox-bottom { position: absolute; left: 0; width: 100%; height: 0%; background: #000; z-index: 10; transition: height 0.3s ease; pointer-events: none; }
        .letterbox-top { top: 0; }
        .letterbox-bottom { bottom: 0; }
        .cinematic-active .letterbox-top, .cinematic-active .letterbox-bottom { height: 12%; }

        .filters-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .filter-btn { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 8px; cursor: font; font-weight: 600; cursor: pointer; transition: 0.2s; text-align: center; }
        .filter-btn:hover { background: #334155; border-color: #38bdf8; }
        .filter-btn.active { background: linear-gradient(135deg, #0284c7, #4f46e5); border-color: transparent; }

        .action-btn { width: 100%; background: #10b981; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; text-align: center; display: none; text-decoration: none; box-shadow: 0 4px 12px rgba(16,185,129,0.3); }
        .action-btn:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 Movie Cinematic Grade Studio</h1>

        <div class="upload-box" id="upload-trigger" onclick="document.getElementById('file-input').click()">
            <div style="font-size: 2rem; margin-bottom: 8px;">📁</div>
            <div style="color: #94a3b8; font-size: 0.95rem;">सिनेमैटिक बनाने के लिए वीडियो चुनें</div>
            <input type="file" id="file-input" accept="video/*" style="display: none;">
        </div>

        <div class="video-wrapper" id="video-wrapper">
            <div class="letterbox-top"></div>
            <video id="source-video" crossorigin="anonymous" playsinline controls></video>
            <canvas id="output-canvas"></canvas>
            <div class="letterbox-bottom"></div>
        </div>

        <div id="controls-section" style="display: none;">
            <div style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; font-weight: bold; text-transform: uppercase;">मूवी लुक चुनें (Movie Grades):</div>
            <div class="filters-grid">
                <button class="filter-btn active" onclick="setFilter('hollywood', this)">🎥 Hollywood Blockbuster</button>
                <button class="filter-btn" onclick="setFilter('cyberpunk', this)">⚡ Cyberpunk Neon</button>
                <button class="filter-btn" onclick="setFilter('vintage', this)">🎞️ Vintage 70s Noir</button>
                <button class="filter-btn" onclick="setFilter('matrix', this)">🟢 Matrix Green Tint</button>
            </div>
            
            <button class="action-btn" id="play-preview-btn" style="display: block; background: #4f46e5; margin-bottom: 10px;" onclick="togglePlay()">▶ Play / Pause Cinematic View</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const uploadTrigger = document.getElementById('upload-trigger');
        const videoWrapper = document.getElementById('video-wrapper');
        const sourceVideo = document.getElementById('source-video');
        const canvas = document.getElementById('output-canvas');
        const ctx = canvas.getContext('2d');
        const controlsSection = document.getElementById('controls-section');

        let currentFilter = 'hollywood';
        let isPlaying = false;

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                sourceVideo.src = url;
                sourceVideo.load();
                sourceVideo.onloadedmetadata = () => {
                    canvas.width = sourceVideo.videoWidth || 1280;
                    canvas.height = sourceVideo.videoHeight || 720;
                    uploadTrigger.style.display = 'none';
                    videoWrapper.style.display = 'block';
                    controlsSection.style.display = 'block';
                    videoWrapper.classList.add('cinematic-active');
                    startProcessing();
                };
            }
        };

        function togglePlay() {
            if (sourceVideo.paused) {
                sourceVideo.play();
                isPlaying = true;
            } else {
                sourceVideo.pause();
                isPlaying = false;
            }
        }

        function setFilter(filterName, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = filterName;
        }

        function startProcessing() {
            function renderFrame() {
                if (!sourceVideo.paused && !sourceVideo.ended) {
                    ctx.drawImage(sourceVideo, 0, 0, canvas.width, canvas.height);
                    applyMovieColorGrade(currentFilter);
                }
                requestAnimationFrame(renderFrame);
            }
            requestAnimationFrame(renderFrame);
            
            sourceVideo.onplay = () => { isPlaying = true; };
            sourceVideo.onpause = () => { isPlaying = false; };
        }

        function applyMovieColorGrade(filter) {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;

            for (let i = 0; i < d.length; i += 4) {
                let r = d[i], g = d[i+1], b = d[i+2];

                if (filter === 'hollywood') {
                    // Teal & Orange Blockbuster Look (Shadows teal, Highlights warm orange)
                    d[i] = r * 1.1 + 10;     // Red boost
                    d[i+1] = g * 0.95;       // Green balance
                    d[i+2] = b * 0.85;       // Blue crush in shadows
                } else if (filter === 'cyberpunk') {
                    // Neon Pink & Electric Cyan High Contrast
                    d[i] = r * 1.3;          // High Red/Pink
                    d[i+1] = g * 0.8;        // Low green
                    d[i+2] = b * 1.4 + 20;   // High Blue/Cyan glow
                } else if (filter === 'vintage') {
                    // Sepia / Warm Golden Nostalgia
                    let avg = (r + g + b) / 3;
                    d[i] = avg * 1.2;
                    d[i+1] = avg * 1.0;
                    d[i+2] = avg * 0.8;
                } else if (filter === 'matrix') {
                    // Heavy Green Sci-Fi Grade
                    d[i] = r * 0.7;
                    d[i+1] = g * 1.3 + 15;
                    d[i+2] = b * 0.7;
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }
    </script>
</body>
</html>
