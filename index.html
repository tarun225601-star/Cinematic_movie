<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viziag Real AI Engine</title>
    <style>
        body { background: #050b14; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 400px; background: #0f172a; padding: 20px; border-radius: 15px; }
        textarea { width: 100%; height: 80px; background: #020617; color: white; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin: 10px 0; }
        button { width: 100%; background: #38bdf8; color: black; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #status { margin-top: 15px; font-size: 0.8rem; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Viziag Real Engine</h2>
    <input type="file" id="fileInput" accept="image/*">
    <textarea id="prompt">Cinematic high-fantasy avatar, 8K, glowing skin, magical highlights, sharp facial features.</textarea>
    <button onclick="generateVideo()">Generate Avatar Video</button>
    <div id="status"></div>
    <video id="resultVideo" width="100%" controls style="margin-top:15px; display:none;"></video>
</div>

<script>
async function generateVideo() {
    const status = document.getElementById('status');
    const apiKey = localStorage.getItem('kling_key'); // अपनी की यहाँ से उठाएगा
    if(!apiKey) { alert("API Key सेट करो!"); return; }

    status.innerText = "🔄 Kling AI से कनेक्ट हो रहा है...";

    // यह Kling AI का आधिकारिक API endpoint है
    const response = await fetch('https://api.klingai.com/v1/videos/image2video', {
        method: 'POST',
        headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            "prompt": document.getElementById('prompt').value,
            "image_url": "URL_OF_UPLOADED_IMAGE", // यहाँ इमेज का बेस64 या लिंक जाएगा
            "mode": "pro",
            "motion_strength": 6
        })
    });

    const data = await response.json();
    status.innerText = "✅ वीडियो रेंडरिंग शुरू हो गई! टास्क ID: " + data.task_id;
    
    // अब हर 5 सेकंड में रिजल्ट चेक करेगा (Polling)
    checkStatus(data.task_id, apiKey);
}

async function checkStatus(taskId, key) {
    const res = await fetch(`https://api.klingai.com/v1/tasks/${taskId}`, {
        headers: { 'Authorization': `Bearer ${key}` }
    });
    const result = await res.json();
    
    if(result.status === 'finished') {
        document.getElementById('resultVideo').src = result.video_url;
        document.getElementById('resultVideo').style.display = 'block';
        document.getElementById('status').innerText = "✨ वीडियो तैयार है!";
    } else {
        document.getElementById('status').innerText = "⏳ रेंडरिंग हो रही है... " + result.status;
        setTimeout(() => checkStatus(taskId, key), 5000);
    }
}
</script>
</body>
</html>
