<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Smooth Cinematic Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #05070b; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: #0f1420; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #1e293b; }
        h1 { font-size: 1.3rem; text-align: center; margin-bottom: 20px; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        
        .upload-box { border: 2px dashed #334155; border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; background: #090d16; margin-bottom: 20px; transition: 0.3s; }
        .upload-box:hover { border-color: #38bdf8; }
        
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 20px; display: none; box-shadow: 0 8px 20px rgba(0,0,0,0.8); }
        
        /* Video element with hardware-accelerated filters for zero lag & zero pixelation */
        video { width: 100%; height: 100%; object-type: contain; position: absolute; top: 0; left: 0; object-fit: contain; }
        
        /* Dynamic Cinematic Letterbox Bars */
        .letterbox-top, .letterbox-bottom { position: absolute; left: 0; width: 100%; background: #000; z-index: 10; pointer-events: none; transition: height 0.05s; }
        .letterbox-top { top: 0; height: 0%; }
        .letterbox-bottom { bottom: 0; height: 0%; }

        .controls-panel { background: #090d16; border: 1px solid #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 20px; display: none; max-height: 350px; overflow-y: auto; }
        .control-group { margin-bottom: 12px; }
        .control-group label { display: flex; justify-content: space-between; font-size: 0.82rem; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
        .control-group input[type="range"] { width: 100%; accent-color: #38bdf8; cursor: pointer; }

        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .action-btn { flex: 1; background: #4f46e5; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 0.95rem; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; }
        .action-btn:hover { opacity: 0.9; }
        .render-btn { background: #10b981; }
        .render-btn:hover { background: #059669; }

        .status-box { font-size: 0.85rem; color: #94a3b8; text-align: center; margin-top: 10px; }
        .download-link-btn { display: none; width: 100%; background: #0284c7; color: white; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: bold; text-align: center; margin-top: 15px; box-shadow: 0 4px 12px rgba(2,132,199,0.3); }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 Smooth HD Cinematic Studio</h1>

        <div class="upload-box" id="upload-trigger" onclick="document.getElementById('file-input').click()">
            <div style="font-size: 2rem; margin-bottom: 8px;">📁</div>
            <div style="color: #94a3b8; font-size: 0.95rem;">एचडी वीडियो फाइल चुनें</div>
            <input type="file" id="file-input" accept="video/*" style="display: none;">
        </div>

        <div class="video-wrapper" id="video-wrapper">
            <div class="letterbox-top" id="lb-top"></div>
            <video id="source-video" crossorigin="anonymous" playsinline></video>
            <div class="letterbox-bottom" id="lb-bottom"></div>
        </div>

        <div class="controls-panel" id="manual-controls">
            <div style="font-size: 0.85rem; color: #38bdf8; margin-bottom: 12px; font-weight: bold; text-transform: uppercase;">🎛️ स्मूथ प्रो कलर ग्रेडिंग टूल्स:</div>
            
            <div class="control-group">
                <label><span>Brightness (ब्राइटनेस / एक्सपोजर)</span><span id="val-brightness">100%</span></label>
                <input type="range" id="range-brightness" min="0" max="200" value="100" step="1" oninput="updateFilters()">
            </div>

            <div class="control-group">
                <label><span>Contrast (कंट्रास्ट / गहराई)</span><span id="val-contrast">100%</span></label>
                <input type="range" id="range-contrast" min="0" max="200" value="100" step="1" oninput="updateFilters()">
            </div>

            <div class="control-group">
                <label><span>Saturation (रंगों का चटकपन)</span><span id="val-saturation">100%</span></label>
                <input type="range" id="range-saturation" min="0" max="200" value="100" step="1" oninput="updateFilters()">
            </div>

            <div class="control-group">
                <label><span>Sepia / Film Tone (सिनेमैटिक वार्मथ)</span><span id="val-sepia">0%</span></label>
                <input type="range" id="range-sepia" min="0" max="100" value="0" step="1" oninput="updateFilters()">
            </div>

            <div class="control-group">
                <label><span>Cinematic Letterbox (काली पट्टियाँ)</span><span id="val-letterbox">10%</span></label>
                <input type="range" id="range-letterbox" min="0" max="25" value="10" step="1" oninput="updateFilters()">
            </div>
        </div>

        <div id="controls-section" style="display: none;">
            <div class="btn-group">
                <button class="action-btn" onclick="togglePlay()">▶ Play / Pause</button>
                <button class="action-btn render-btn" id="record-btn" onclick="startSmoothRecording()">🔴 Record Smooth HD</button>
            </div>

            <div class="status-box" id="status-text">क्वालिटी सेट करें और रिकॉर्ड बटन दबाएं।</div>

            <a href="#" class="download-link-btn" id="download-btn" download="smooth_hd_cinematic.webm">⬇️ Download Clean HD Video</a>
        </div>
    </div>

    <script>
        let selectedFile = null;
        let mediaRecorder;
        let recordedChunks = [];

        const fileInput = document.getElementById('file-input');
        const uploadTrigger = document.getElementById('upload-trigger');
        const videoWrapper = document.getElementById('video-wrapper');
        const sourceVideo = document.getElementById('source-video');
        const controlsSection = document.getElementById('controls-section');
        const manualControls = document.getElementById('manual-controls');
        const statusText = document.getElementById('status-text');
        const downloadBtn = document.getElementById('download-btn');
        const recordBtn = document.getElementById('record-btn');

        const lbTop = document.getElementById('lb-top');
        const lbBottom = document.getElementById('lb-bottom');

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                const url = URL.createObjectURL(file);
                sourceVideo.src = url;
                sourceVideo.load();
                sourceVideo.onloadedmetadata = () => {
                    uploadTrigger.style.display = 'none';
                    videoWrapper.style.display = 'block';
                    manualControls.style.display = 'block';
                    controlsSection.style.display = 'block';
                    updateFilters();
                };
            }
        };

        function updateFilters() {
            let b = document.getElementById('range-brightness').value;
            let c = document.getElementById('range-contrast').value;
            let s = document.getElementById('range-saturation').value;
            let sep = document.getElementById('range-sepia').value;
            let lb = document.getElementById('range-letterbox').value;

            document.getElementById('val-brightness').innerText = b + '%';
            document.getElementById('val-contrast').innerText = c + '%';
            document.getElementById('val-saturation').innerText = s + '%';
            document.getElementById('val-sepia').innerText = sep + '%';
            document.getElementById('val-letterbox').innerText = lb + '%';

            // Apply direct GPU hardware filters to prevent any pixelation or lag
            sourceVideo.style.filter = `brightness(${b}%) contrast(${c}%) saturate(${s}%) sepia(${sep}%)`;

            lbTop.style.height = lb + '%';
            lbBottom.style.height = lb + '%';
        }

        function togglePlay() {
            if (sourceVideo.paused) sourceVideo.play();
            else sourceVideo.pause();
        }

        function startSmoothRecording() {
            if (sourceVideo.paused) {
                sourceVideo.play();
            }
            
            recordedChunks = [];
            
            // Capture directly from the video element stream for ultimate clarity and HD smoothness
            const stream = sourceVideo.captureStream ? sourceVideo.captureStream() : sourceVideo.mozCaptureStream();
            
            try {
                mediaRecorder = new MediaRecorder(stream, { 
                    mimeType: 'video/webm; codecs=vp9',
                    videoBitsPerSecond: 5000000 // High bitrate for crystal clear HD output without pixel loss
                });
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream); 
            }

            mediaRecorder.ondataavailable = function(event) {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                downloadBtn.href = url;
                downloadBtn.style.display = 'block';
                statusText.innerText = "रेंडर सफल! वीडियो एकदम क्लियर और स्मूथ एचडी में तैयार है।";
                recordBtn.innerText = "🔴 Record Smooth HD";
                recordBtn.style.background = "#10b981";
            };

            mediaRecorder.start();
            statusText.innerText = "स्मूथ रिकॉर्डिंग चालू है... वीडियो खत्म होने तक इंतज़ार करें।";
            recordBtn.innerText = "⏹️ Recording... (Click to Stop)";
            recordBtn.style.background = "#ef4444";

            sourceVideo.onended = () => {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                }
            };

            recordBtn.onclick = () => {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                    sourceVideo.pause();
                }
            };
        }
    </script>
</body>
</html>
