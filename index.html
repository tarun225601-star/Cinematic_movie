<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Studio Pro - Smooth Export</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #05070b; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: #0f1420; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #1e293b; }
        h1 { font-size: 1.3rem; text-align: center; margin-bottom: 20px; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        
        .upload-box { border: 2px dashed #334155; border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; background: #090d16; margin-bottom: 20px; transition: 0.3s; }
        .upload-box:hover { border-color: #38bdf8; }
        
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 20px; display: none; box-shadow: 0 8px 20px rgba(0,0,0,0.8); }
        video, canvas { width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0; }
        
        /* Anamorphic Letterbox Bars */
        .letterbox-top, .letterbox-bottom { position: absolute; left: 0; width: 100%; height: 12%; background: #000; z-index: 10; pointer-events: none; }
        .letterbox-top { top: 0; }
        .letterbox-bottom { bottom: 0; }

        .filters-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .filter-btn { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; text-align: center; }
        .filter-btn:hover { background: #334155; border-color: #38bdf8; }
        .filter-btn.active { background: linear-gradient(135deg, #0284c7, #4f46e5); border-color: transparent; }

        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .action-btn { flex: 1; background: #4f46e5; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 0.95rem; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; }
        .action-btn:hover { opacity: 0.9; }
        .render-btn { background: #10b981; }
        .render-btn:hover { background: #059669; }

        .status-box { font-size: 0.85rem; color: #94a3b8; text-align: center; margin-top: 10px; }
        
        .download-link-btn { display: none; width: 100%; background: #0284c7; color: white; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: bold; text-align: center; margin-top: 15px; box-shadow: 0 4px 12px rgba(2,132,199,0.3); }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 Cinematic Studio (Smooth)</h1>

        <div class="upload-box" id="upload-trigger" onclick="document.getElementById('file-input').click()">
            <div style="font-size: 2rem; margin-bottom: 8px;">📁</div>
            <div style="color: #94a3b8; font-size: 0.95rem;">वीडियो फाइल चुनें</div>
            <input type="file" id="file-input" accept="video/*" style="display: none;">
        </div>

        <div class="video-wrapper" id="video-wrapper">
            <div class="letterbox-top"></div>
            <video id="source-video" crossorigin="anonymous" playsinline></video>
            <canvas id="output-canvas"></canvas>
            <div class="letterbox-bottom"></div>
        </div>

        <div id="controls-section" style="display: none;">
            <div style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; font-weight: bold; text-transform: uppercase;">मूवी लुक चुनें:</div>
            <div class="filters-grid">
                <button class="filter-btn active" onclick="setFilter('hollywood', this)">🎥 Hollywood Grade</button>
                <button class="filter-btn" onclick="setFilter('cyberpunk', this)">⚡ Cyberpunk Neon</button>
                <button class="filter-btn" onclick="setFilter('vintage', this)">🎞️ Vintage Noir</button>
                <button class="filter-btn" onclick="setFilter('matrix', this)">🟢 Matrix Green</button>
            </div>
            
            <div class="btn-group">
                <button class="action-btn" onclick="togglePlay()">▶ Play / Pause</button>
                <button class="action-btn render-btn" id="record-btn" onclick="startRecordingExport()">🔴 Record Smooth HD</button>
            </div>

            <div class="status-box" id="status-text">तैयार है। 'Record Smooth HD' दबाएं।</div>

            <a href="#" class="download-link-btn" id="download-btn" download="smooth_cinematic.webm">⬇️ Download Smooth Video</a>
        </div>
    </div>

    <script>
        let selectedFile = null;
        let currentFilter = 'hollywood';
        let mediaRecorder;
        let recordedChunks = [];

        const fileInput = document.getElementById('file-input');
        const uploadTrigger = document.getElementById('upload-trigger');
        const videoWrapper = document.getElementById('video-wrapper');
        const sourceVideo = document.getElementById('source-video');
        const canvas = document.getElementById('output-canvas');
        const ctx = canvas.getContext('2d');
        const controlsSection = document.getElementById('controls-section');
        const statusText = document.getElementById('status-text');
        const downloadBtn = document.getElementById('download-btn');
        const recordBtn = document.getElementById('record-btn');

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                const url = URL.createObjectURL(file);
                sourceVideo.src = url;
                sourceVideo.load();
                sourceVideo.onloadedmetadata = () => {
                    // HD 720p resolution set for smooth processing on mobile
                    canvas.width = 1280;
                    canvas.height = 720;
                    uploadTrigger.style.display = 'none';
                    videoWrapper.style.display = 'block';
                    controlsSection.style.display = 'block';
                    startLivePreview();
                };
            }
        };

        function togglePlay() {
            if (sourceVideo.paused) sourceVideo.play();
            else sourceVideo.pause();
        }

        function setFilter(filterName, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = filterName;
        }

        function startLivePreview() {
            function renderFrame() {
                if (!sourceVideo.paused && !sourceVideo.ended) {
                    ctx.drawImage(sourceVideo, 0, 0, canvas.width, canvas.height);
                    applyColorGradeToCanvas(currentFilter);
                }
                requestAnimationFrame(renderFrame);
            }
            requestAnimationFrame(renderFrame);
        }

        function applyColorGradeToCanvas(filter) {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                let r = d[i], g = d[i+1], b = d[i+2];
                if (filter === 'hollywood') {
                    d[i] = r * 1.1 + 10; d[i+1] = g * 0.95; d[i+2] = b * 0.85;
                } else if (filter === 'cyberpunk') {
                    d[i] = r * 1.3; d[i+1] = g * 0.8; d[i+2] = b * 1.4 + 20;
                } else if (filter === 'vintage') {
                    let avg = (r + g + b) / 3;
                    d[i] = avg * 1.2; d[i+1] = avg * 1.0; d[i+2] = avg * 0.8;
                } else if (filter === 'matrix') {
                    d[i] = r * 0.7; d[i+1] = g * 1.3 + 15; d[i+2] = b * 0.7;
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        function startRecordingExport() {
            if (sourceVideo.paused) {
                sourceVideo.play();
            }
            
            recordedChunks = [];
            // Optimized 24 FPS (Cinematic standard frame rate) for smooth mobile rendering
            const stream = canvas.captureStream(24); 
            
            try {
                mediaRecorder = new MediaRecorder(stream, { 
                    mimeType: 'video/webm; codecs=vp9',
                    videoBitsPerSecond: 2500000 // Stable bitrate to prevent lagging
                });
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream); 
            }

            mediaRecorder.ondataavailable = function(event) {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                downloadBtn.href = url;
                downloadBtn.style.display = 'block';
                statusText.innerText = "रेंडर पूरा हुआ! अब वीडियो बिल्कुल स्मूथ चलेगी।";
                recordBtn.innerText = "🔴 Record Smooth HD";
                recordBtn.style.background = "#10b981";
            };

            mediaRecorder.start();
            statusText.innerText = "स्मूथ रिकॉर्डिंग चालू है... वीडियो खत्म होने का इंतज़ार करें।";
            recordBtn.innerText = "⏹️ Recording... (Click to Stop)";
            recordBtn.style.background = "#ef4444";

            sourceVideo.onended = () => {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                }
            };

            recordBtn.onclick = () => {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                    sourceVideo.pause();
                }
            };
        }
    </script>
</body>
</html>
