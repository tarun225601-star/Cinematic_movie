<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Pro Cinematic Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #05070b; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: #0f1420; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #1e293b; }
        h1 { font-size: 1.3rem; text-align: center; margin-bottom: 20px; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        
        .upload-box { border: 2px dashed #334155; border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; background: #090d16; margin-bottom: 20px; transition: 0.3s; }
        .upload-box:hover { border-color: #38bdf8; }
        
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 20px; display: none; box-shadow: 0 8px 20px rgba(0,0,0,0.8); }
        video, canvas { width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0; }
        
        /* Dynamic Letterbox Bars */
        .letterbox-top, .letterbox-bottom { position: absolute; left: 0; width: 100%; background: #000; z-index: 10; pointer-events: none; transition: height 0.1s; }
        .letterbox-top { top: 0; height: 0%; }
        .letterbox-bottom { bottom: 0; height: 0%; }

        .controls-panel { background: #090d16; border: 1px solid #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 20px; display: none; max-height: 350px; overflow-y: auto; }
        .control-group { margin-bottom: 12px; }
        .control-group label { display: flex; justify-content: space-between; font-size: 0.82rem; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
        .control-group input[type="range"] { width: 100%; accent-color: #38bdf8; cursor: pointer; }

        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .action-btn { flex: 1; background: #4f46e5; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 0.95rem; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; }
        .action-btn:hover { opacity: 0.9; }
        .render-btn { background: #10b981; }
        .render-btn:hover { background: #059669; }

        .status-box { font-size: 0.85rem; color: #94a3b8; text-align: center; margin-top: 10px; }
        .download-link-btn { display: none; width: 100%; background: #0284c7; color: white; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: bold; text-align: center; margin-top: 15px; box-shadow: 0 4px 12px rgba(2,132,199,0.3); }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 Ultimate Cinematic Studio</h1>

        <div class="upload-box" id="upload-trigger" onclick="document.getElementById('file-input').click()">
            <div style="font-size: 2rem; margin-bottom: 8px;">📁</div>
            <div style="color: #94a3b8; font-size: 0.95rem;">वीडियो फाइल चुनें</div>
            <input type="file" id="file-input" accept="video/*" style="display: none;">
        </div>

        <div class="video-wrapper" id="video-wrapper">
            <div class="letterbox-top" id="lb-top"></div>
            <video id="source-video" crossorigin="anonymous" playsinline></video>
            <canvas id="output-canvas"></canvas>
            <div class="letterbox-bottom" id="lb-bottom"></div>
        </div>

        <div class="controls-panel" id="manual-controls">
            <div style="font-size: 0.85rem; color: #38bdf8; margin-bottom: 12px; font-weight: bold; text-transform: uppercase;">🎛️ प्रो कलर ग्रेडिंग टूल्स (0% से 200%):</div>
            
            <div class="control-group">
                <label><span>Exposure (लाइट / एक्सपोजर)</span><span id="val-exposure">100%</span></label>
                <input type="range" id="range-exposure" min="0" max="200" value="100" step="1" oninput="updateValues()">
            </div>

            <div class="control-group">
                <label><span>Contrast (कंट्रास्ट / डीपनेस)</span><span id="val-contrast">100%</span></label>
                <input type="range" id="range-contrast" min="0" max="200" value="100" step="1" oninput="updateValues()">
            </div>

            <div class="control-group">
                <label><span>Saturation (रंग चटकपन)</span><span id="val-saturation">100%</span></label>
                <input type="range" id="range-saturation" min="0" max="200" value="100" step="1" oninput="updateValues()">
            </div>

            <div class="control-group">
                <label><span>Temperature (वार्म / कूल टोन)</span><span id="val-temp">0</span></label>
                <input type="range" id="range-temp" min="-50" max="50" value="0" step="1" oninput="updateValues()">
            </div>

            <div class="control-group">
                <label><span>Cinematic Letterbox (सिनेमैटिक पट्टी)</span><span id="val-letterbox">10%</span></label>
                <input type="range" id="range-letterbox" min="0" max="25" value="10" step="1" oninput="updateValues()">
            </div>
        </div>

        <div id="controls-section" style="display: none;">
            <div class="btn-group">
                <button class="action-btn" onclick="togglePlay()">▶ Play / Pause</button>
                <button class="action-btn render-btn" id="record-btn" onclick="startRecordingExport()">🔴 Record & Export HD</button>
            </div>

            <div class="status-box" id="status-text">कंट्रोल सेट करें और वीडियो रिकॉर्ड करें।</div>

            <a href="#" class="download-link-btn" id="download-btn" download="master_cinematic.webm">⬇️ Download Cinematic Video</a>
        </div>
    </div>

    <script>
        let selectedFile = null;
        let mediaRecorder;
        let recordedChunks = [];

        const fileInput = document.getElementById('file-input');
        const uploadTrigger = document.getElementById('upload-trigger');
        const videoWrapper = document.getElementById('video-wrapper');
        const sourceVideo = document.getElementById('source-video');
        const canvas = document.getElementById('output-canvas');
        const ctx = canvas.getContext('2d');
        const controlsSection = document.getElementById('controls-section');
        const manualControls = document.getElementById('manual-controls');
        const statusText = document.getElementById('status-text');
        const downloadBtn = document.getElementById('download-btn');
        const recordBtn = document.getElementById('record-btn');

        const lbTop = document.getElementById('lb-top');
        const lbBottom = document.getElementById('lb-bottom');

        let exposureVal = 100;
        let contrastVal = 100;
        let saturationVal = 100;
        let tempVal = 0;
        let letterboxVal = 10;

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                const url = URL.createObjectURL(file);
                sourceVideo.src = url;
                sourceVideo.load();
                sourceVideo.onloadedmetadata = () => {
                    canvas.width = 1280;
                    canvas.height = 720;
                    uploadTrigger.style.display = 'none';
                    videoWrapper.style.display = 'block';
                    manualControls.style.display = 'block';
                    controlsSection.style.display = 'block';
                    startLivePreview();
                };
            }
        };

        function updateValues() {
            exposureVal = document.getElementById('range-exposure').value;
            contrastVal = document.getElementById('range-contrast').value;
            saturationVal = document.getElementById('range-saturation').value;
            tempVal = document.getElementById('range-temp').value;
            letterboxVal = document.getElementById('range-letterbox').value;

            document.getElementById('val-exposure').innerText = exposureVal + '%';
            document.getElementById('val-contrast').innerText = contrastVal + '%';
            document.getElementById('val-saturation').innerText = saturationVal + '%';
            document.getElementById('val-temp').innerText = tempVal;
            document.getElementById('val-letterbox').innerText = letterboxVal + '%';

            lbTop.style.height = letterboxVal + '%';
            lbBottom.style.height = letterboxVal + '%';
        }

        function togglePlay() {
            if (sourceVideo.paused) sourceVideo.play();
            else sourceVideo.pause();
        }

        function startLivePreview() {
            function renderFrame() {
                if (!sourceVideo.paused && !sourceVideo.ended) {
                    ctx.drawImage(sourceVideo, 0, 0, canvas.width, canvas.height);
                    applyProColorGrading();
                }
                requestAnimationFrame(renderFrame);
            }
            requestAnimationFrame(renderFrame);
        }

        function applyProColorGrading() {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;
            
            let exp = exposureVal / 100;
            let c = contrastVal / 100;
            let s = saturationVal / 100;
            let t = parseInt(tempVal);

            for (let i = 0; i < d.length; i += 4) {
                let r = d[i], g = d[i+1], b = d[i+2];

                // 1. Exposure & Contrast
                r = (r * exp);
                g = (g * exp);
                b = (b * exp);

                r = c * (r - 128) + 128;
                g = c * (g - 128) + 128;
                b = c * (b - 128) + 128;

                // 2. Temperature (Warm/Cool shift)
                r += t;
                b -= t;

                // 3. Saturation
                let gray = 0.2989 * r + 0.5870 * g + 0.1140 * b;
                r = gray + s * (r - gray);
                g = gray + s * (g - gray);
                b = gray + s * (b - gray);

                d[i]   = Math.min(255, Math.max(0, r));
                d[i+1] = Math.min(255, Math.max(0, g));
                d[i+2] = Math.min(255, Math.max(0, b));
            }
            ctx.putImageData(imgData, 0, 0);
        }

        function startRecordingExport() {
            if (sourceVideo.paused) {
                sourceVideo.play();
            }
            
            recordedChunks = [];
            const stream = canvas.captureStream(30); 
            
            try {
                mediaRecorder = new MediaRecorder(stream, { 
                    mimeType: 'video/webm; codecs=vp9',
                    videoBitsPerSecond: 3000000 
                });
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream); 
            }

            mediaRecorder.ondataavailable = function(event) {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                downloadBtn.href = url;
                downloadBtn.style.display = 'block';
                statusText.innerText = "रेंडर सफल! सिनेमैटिक वीडियो डाउनलोड के लिए तैयार है।";
                recordBtn.innerText = "🔴 Record & Export HD";
                recordBtn.style.background = "#10b981";
            };

            mediaRecorder.start();
            statusText.innerText = "रिकॉर्डिंग जारी है... वीडियो पूरी होने तक इंतज़ार करें।";
            recordBtn.innerText = "⏹️ Recording... (Click to Stop)";
            recordBtn.style.background = "#ef4444";

            sourceVideo.onended = () => {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                }
            };

            recordBtn.onclick = () => {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                    sourceVideo.pause();
                }
            };
        }
    </script>
</body>
</html>
