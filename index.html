<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viziag Global - Autonomous AI Cinematic Studio</title>
    <style>
        :root {
            --bg-base: #030712;
            --bg-card: #0b0f19;
            --bg-card-hover: #0f172a;
            --border-color: #1e293b;
            --border-hover: #38bdf8;
            --text-main: #f9fafb;
            --text-muted: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .container { width: 100%; max-width: 680px; background: var(--bg-card); border-radius: 24px; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9); border: 1px solid var(--border-color); position: relative; backdrop-filter: blur(10px); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .header-title-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #38bdf8, #6366f1); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }
        h1 { font-size: 1rem; background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; letter-spacing: 0.5px; }
        
        .header-right { display: flex; align-items: center; gap: 10px; }
        .pro-badge { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); color: var(--accent-primary); font-size: 0.65rem; padding: 5px 12px; border-radius: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .settings-btn { background: var(--border-color); border: 1px solid var(--border-color); color: var(--text-main); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; transition: all 0.3s ease; }
        .settings-btn:hover { background: var(--bg-card-hover); border-color: var(--accent-primary); transform: rotate(45deg); }

        /* Professional Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; width: 100%; max-width: 420px; padding: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.9); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .modal-header h3 { font-size: 0.95rem; color: var(--accent-primary); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .close-modal { background: none; border: none; color: var(--text-muted); font-size: 1.3rem; cursor: pointer; }
        
        .modal-group { margin-bottom: 15px; }
        .modal-group label { display: block; font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
        .modal-input, .modal-select { width: 100%; background: var(--bg-base); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; color: var(--text-main); font-size: 0.85rem; outline: none; }
        .modal-save-btn { width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 10px; }

        /* Autonomous Prompt Section */
        .prompt-card { background: var(--bg-card-hover); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 20px; }
        .prompt-label { font-size: 0.72rem; color: var(--accent-primary); font-weight: 800; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .prompt-input-group { display: flex; gap: 8px; }
        .prompt-input { flex: 1; background: var(--bg-base); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; color: var(--text-main); font-size: 0.85rem; outline: none; }
        .run-prompt-btn { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; padding: 0 18px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 0.85rem; transition: opacity 0.2s; }
        .run-prompt-btn:hover { opacity: 0.9; }

        /* Upload Area */
        .upload-box { border: 2px dashed var(--border-color); border-radius: 16px; padding: 25px 20px; text-align: center; cursor: pointer; background: var(--bg-card-hover); margin-bottom: 20px; transition: all 0.3s ease; }
        .upload-box:hover { border-color: var(--accent-primary); background: #131c31; }
        
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 9/16; max-height: 280px; background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 20px; display: none; border: 1px solid var(--border-color); margin-left: auto; margin-right: auto; }
        video, canvas { width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0; }
        
        .letterbox-top, .letterbox-bottom { position: absolute; left: 0; width: 100%; background: #000; z-index: 10; pointer-events: none; }
        .letterbox-top { top: 0; height: 10%; }
        .letterbox-bottom { bottom: 0; height: 10%; }

        /* Autonomous Live Logs Console */
        .logs-section { background: var(--bg-base); border: 1px solid var(--border-color); border-radius: 16px; padding: 15px; margin-bottom: 20px; display: none; }
        .logs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .logs-title { font-size: 0.72rem; color: var(--accent-primary); font-weight: 800; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
        
        .logs-container { max-height: 130px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; font-size: 0.75rem; color: #cbd5e1; }
        .logs-container::-webkit-scrollbar { width: 4px; }
        .logs-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        .log-line { margin-bottom: 5px; line-height: 1.4; border-left: 2px solid var(--accent-primary); padding-left: 8px; }
        .log-error { border-left-color: var(--accent-danger) !important; color: #f87171 !important; font-weight: bold; }
        .log-success { border-left-color: var(--accent-success) !important; color: #34d399 !important; font-weight: bold; }

        /* Prominent Download Button (100% Completion style) */
        .download-link-btn { display: none; width: 100%; background: linear-gradient(135deg, #0284c7, #0369a1); color: white; text-decoration: none; padding: 16px; border-radius: 12px; font-weight: 800; text-align: center; font-size: 0.95rem; box-shadow: 0 8px 25px rgba(2, 132, 199, 0.5); margin-top: 10px; animation: pulseGlow 2s infinite; }
        
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(2, 132, 199, 0); }
            100% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Professional Header -->
        <div class="header">
            <div class="header-title-area">
                <div class="logo-icon">✨</div>
                <h1>VIZIAG GLOBAL - AUTONOMOUS STUDIO</h1>
            </div>
            <div class="header-right">
                <div class="pro-badge">PRO AI</div>
                <button class="settings-btn" onclick="toggleSettingsModal(true)">⚙️</button>
            </div>
        </div>

        <!-- Settings Modal -->
        <div class="modal-overlay" id="settings-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>⚙️ API Configuration</h3>
                    <button class="close-modal" onclick="toggleSettingsModal(false)">✕</button>
                </div>
                <div class="modal-group">
                    <label>🔑 Secure API Key</label>
                    <input type="password" id="modal-api-key" class="modal-input" placeholder="API Key यहाँ दर्ज करें...">
                </div>
                <button class="modal-save-btn" onclick="saveSettingsAndClose()">💾 Save Configuration</button>
            </div>
        </div>

        <!-- Autonomous Prompt Director Box -->
        <div class="prompt-card">
            <div class="prompt-label">🧠 Autonomous Prompt Director</div>
            <div class="prompt-input-group">
                <input type="text" id="ai-prompt-input" class="prompt-input" value="Cinematic movie scene, anamorphic lens, 35mm film grain, 8K resolution..." placeholder="अपना प्रॉम्प्ट यहाँ दर्ज करें...">
                <button class="run-prompt-btn" onclick="executeAutonomousPrompt()">⚡ Run AI</button>
            </div>
        </div>

        <!-- File Upload Box -->
        <div class="upload-box" id="upload-trigger" onclick="document.getElementById('file-input').click()">
            <div style="font-size: 1.8rem; margin-bottom: 6px;">🎬</div>
            <div style="color: #cbd5e1; font-weight: 700; font-size: 0.88rem; margin-bottom: 3px;">वीडियो अपलोड करें (क्लिक करें)</div>
            <div style="color: var(--text-muted); font-size: 0.72rem;">MP4, WebM हाई-रेजोल्यूशन सपोर्ट</div>
            <input type="file" id="file-input" accept="video/*" style="display: none;">
        </div>

        <!-- Video Workspace Preview -->
        <div class="video-wrapper" id="video-wrapper">
            <div class="letterbox-top"></div>
            <video id="source-video" crossorigin="anonymous" playsinline muted style="display:none;"></video>
            <canvas id="output-canvas"></canvas>
            <div class="letterbox-bottom"></div>
        </div>

        <!-- Autonomous Live Logs Console -->
        <div class="logs-section" id="logs-section">
            <div class="logs-header">
                <div class="logs-title">⚡ Live Autonomous Logs & Progress</div>
                <div id="progress-indicator" style="font-size: 0.75rem; color: var(--accent-primary); font-weight: bold;">0%</div>
            </div>
            <div class="logs-container" id="logs-console">
                <div class="log-line">सिस्टम तैयार है। प्रॉम्प्ट और वीडियो का इंतज़ार है...</div>
            </div>
        </div>

        <!-- Prominent Download Button Displayed on 100% Complete -->
        <a href="#" class="download-link-btn" id="download-btn" download="viziag_cinematic_master.webm">⬇️ DOWNLOAD PRO RENDERED MOVIE (100% READY)</a>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let renderTimer = null;

        const fileInput = document.getElementById('file-input');
        const uploadTrigger = document.getElementById('upload-trigger');
        const videoWrapper = document.getElementById('video-wrapper');
        const sourceVideo = document.getElementById('source-video');
        const canvas = document.getElementById('output-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        const logsSection = document.getElementById('logs-section');
        const logsConsole = document.getElementById('logs-console');
        const progressIndicator = document.getElementById('progress-indicator');
        const downloadBtn = document.getElementById('download-btn');
        const aiPromptInput = document.getElementById('ai-prompt-input');

        function addLog(text, type = 'normal') {
            logsSection.style.display = 'block';
            const div = document.createElement('div');
            div.className = 'log-line ' + (type === 'error' ? 'log-error' : type === 'success' ? 'log-success' : '');
            div.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            logsConsole.appendChild(div);
            logsConsole.scrollTop = logsConsole.scrollHeight;
        }

        window.onload = () => {
            const savedKey = localStorage.getItem('viziag_api_key');
            if (savedKey) document.getElementById('modal-api-key').value = savedKey;
        };

        function toggleSettingsModal(show) {
            document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
        }

        function saveSettingsAndClose() {
            const apiKey = document.getElementById('modal-api-key').value.trim();
            if (!apiKey) {
                alert("⚠️ कृपया सिक्योर एपीआई की दर्ज करें!");
                return;
            }
            localStorage.setItem('viziag_api_key', apiKey);
            toggleSettingsModal(false);
            addLog("API Key सफलतापूर्वक सेव की गई।", "success");
        }

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                addLog(`फाइल लोड हो रही है: ${file.name}`);
                const tempVideo = document.createElement('video');
                tempVideo.src = URL.createObjectURL(file);
                tempVideo.onloadedmetadata = () => {
                    sourceVideo.src = tempVideo.src;
                    sourceVideo.load();
                    
                    sourceVideo.onloadedmetadata = () => {
                        canvas.width = sourceVideo.videoWidth || 1080;
                        canvas.height = sourceVideo.videoHeight || 1920;
                        
                        uploadTrigger.style.display = 'none';
                        videoWrapper.style.display = 'block';
                        
                        addLog(`वीडियो फ्रेम मैपिंग सफल: ${canvas.width}x${canvas.height}`, "success");
                        renderLoop();
                    };
                };
            } else {
                addLog("एरर: फाइल लोड करने में विफल!", "error");
            }
        };

        function renderLoop() {
            if (sourceVideo.readyState >= 2) {
                ctx.save();
                ctx.filter = `brightness(105%) contrast(110%) saturate(135%)`;
                ctx.drawImage(sourceVideo, 0, 0, canvas.width, canvas.height);
                ctx.restore();
            }
            requestAnimationFrame(renderLoop);
        }

        // --- Execute processing immediately when Run AI button is clicked ---
        function executeAutonomousPrompt() {
            const promptText = aiPromptInput.value.trim();
            if (!promptText) {
                alert("⚠️ कृपया पहले प्रॉम्प्ट दर्ज करें!");
                return;
            }

            if (sourceVideo.paused && sourceVideo.src) {
                sourceVideo.currentTime = 0;
                sourceVideo.play();
            }

            addLog(`ऑटोनॉमस प्रॉम्प्ट निष्पादित हो रहा है: "${promptText}"`, "success");
            
            recordedChunks = [];
            const stream = canvas.captureStream ? canvas.captureStream(60) : null;
            
            if (!stream) {
                addLog("एरर: कैनवास स्ट्रीम कैप्चर समर्थित नहीं है!", "error");
                return;
            }

            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9', videoBitsPerSecond: 15000000 });
                addLog("मीडिया रिकॉर्डर VP9 कोडेक के साथ सक्रिय हुआ।");
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream);
                addLog("डिफ़ॉल्ट कोडेक पर रिकॉर्डिंग शुरू की गई।");
            }

            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                downloadBtn.href = URL.createObjectURL(blob);
                downloadBtn.style.display = 'block';
                progressIndicator.innerText = "100%";
                addLog("100% - मूवी रेंडरिंग पूरी हुई! नीचे डाउनलोड बटन उपलब्ध है।", "success");
            };

            mediaRecorder.start();
            addLog("AI प्रोसेसिंग और कलर ग्रेडिंग शुरू (0%)...");

            let renderPercent = 0;
            if (renderTimer) clearInterval(renderTimer);
            
            renderTimer = setInterval(() => {
                renderPercent += 4; 
                let currentPercentInt = Math.min(Math.floor(renderPercent), 100);
                progressIndicator.innerText = currentPercentInt + "%";
                
                if (currentPercentInt % 25 === 0) {
                    addLog(`प्रोसेसिंग प्रगति: ${currentPercentInt}% पूरी हो चुकी है...`);
                }
                
                if (currentPercentInt >= 100) {
                    clearInterval(renderTimer);
                    if (mediaRecorder && mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                    }
                    if(!sourceVideo.paused) sourceVideo.pause();
                }
            }, 1000);
        }
    </script>
</body>
</html>
