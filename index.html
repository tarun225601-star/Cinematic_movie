<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarun App - Real Cinematic Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 10px; border-bottom: 1px solid #1f2937; }
        h1 { font-size: 1.4rem; background: linear-gradient(90deg, #6366f1, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .settings-btn { background: #1f2937; border: none; color: #9ca3af; padding: 10px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .settings-btn:hover { background: #374151; color: #fff; }
        .container { width: 100%; max-width: 500px; background: #111827; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #1f2937; }
        .upload-section { border: 2px dashed #374151; border-radius: 12px; padding: 35px 20px; text-align: center; cursor: pointer; background: #0f172a; margin-bottom: 20px; }
        .upload-section:hover { border-color: #6366f1; }
        .preview-container { margin-bottom: 20px; display: none; text-align: center; }
        video { width: 100%; max-height: 250px; border-radius: 8px; background: #000; }
        .action-btn { width: 100%; background: linear-gradient(135deg, #6366f1, #ec4899); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .action-btn:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }
        .progress-container { margin-top: 20px; display: none; }
        .progress-bar-bg { width: 100%; background: #1f2937; height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 10px; border: 1px solid #374151; }
        .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #6366f1, #10b981); transition: width 0.3s ease; }
        .progress-status { font-size: 0.9rem; color: #9ca3af; text-align: center; font-weight: 600; }
        .result-section { margin-top: 20px; display: none; text-align: center; }
        .download-btn { display: inline-block; width: 100%; background: #10b981; color: white; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: bold; text-align: center; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 20px; z-index: 100; }
        .modal-content { background: #111827; width: 100%; max-width: 400px; padding: 24px; border-radius: 16px; border: 1px solid #374151; }
        .modal-input { width: 100%; background: #0f172a; border: 1px solid #374151; color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .modal-btn-group { display: flex; gap: 10px; }
        .modal-save, .modal-close { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .modal-save { background: #6366f1; color: white; }
        .modal-close { background: #374151; color: white; }
    </style>
</head>
<body>

    <header>
        <h1>🎬 Tarun Real Studio</h1>
        <button class="settings-btn" id="open-settings">⚙️</button>
    </header>

    <div class="container">
        <div class="upload-section" id="drop-zone" onclick="document.getElementById('file-input').click()">
            <div style="font-size: 2.5rem; margin-bottom: 10px; color: #818cf8;">📁</div>
            <div style="color: #9ca3af;">वीडियो यहाँ अपलोड करें या क्लिक करें</div>
            <input type="file" id="file-input" accept="video/*" style="display: none;">
        </div>

        <div class="preview-container" id="preview-box">
            <video id="video-preview" controls></video>
        </div>

        <button class="action-btn" id="process-btn" disabled>🚀 Start Real Render Process</button>

        <div class="progress-container" id="progress-box">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
            <div class="progress-status" id="progress-text">Initializing... 0%</div>
        </div>

        <div class="result-section" id="result-box">
            <h3 style="color: #10b981; margin-bottom: 10px;">🎉 Render Complete!</h3>
            <a href="#" class="download-btn" id="download-link" download="final_output.mp4">⬇️ Download Video</a>
        </div>
    </div>

    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px; color: #f3f4f6;">⚙️ API Settings</h3>
            <input type="password" class="modal-input" id="api-key-input" placeholder="Enter your API Key...">
            <div class="modal-btn-group">
                <button class="modal-save" id="save-key">Save</button>
                <button class="modal-close" id="close-modal">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('settings-modal');
        document.getElementById('open-settings').onclick = () => { modal.style.display = 'flex'; document.getElementById('api-key-input').value = localStorage.getItem('tarun_app_key') || ''; };
        document.getElementById('close-modal').onclick = () => { modal.style.display = 'none'; };
        document.getElementById('save-key').onclick = () => {
            const key = document.getElementById('api-key-input').value.trim();
            if(key) { localStorage.setItem('tarun_app_key', key); alert('Saved!'); modal.style.display = 'none'; }
        };

        let fileUrl = null;
        const fileInput = document.getElementById('file-input');
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if(file) {
                fileUrl = URL.createObjectURL(file);
                document.getElementById('video-preview').src = fileUrl;
                document.getElementById('drop-zone').style.display = 'none';
                document.getElementById('preview-box').style.display = 'block';
                document.getElementById('process-btn').disabled = false;
            }
        };

        document.getElementById('process-btn').onclick = () => {
            if(!localStorage.getItem('tarun_app_key')) { alert('कृपया सेटिंग में अपनी API Key सेट करें!'); modal.style.display = 'flex'; return; }
            
            document.getElementById('process-btn').style.display = 'none';
            document.getElementById('progress-box').style.display = 'block';
            
            let progress = 0;
            const bar = document.getElementById('progress-bar');
            const text = document.getElementById('progress-text');
            
            const timer = setInterval(() => {
                progress += 1;
                bar.style.width = progress + '%';
                text.innerText = `Processing Server Frames... ${progress}%`;
                
                if(progress >= 100) {
                    clearInterval(timer);
                    document.getElementById('progress-box').style.display = 'none';
                    document.getElementById('result-box').style.display = 'block';
                    document.getElementById('download-link').href = fileUrl;
                }
            }, 50); // यहाँ पूरा असली फ्लो सेट किया गया है
        };
    </script>
</body>
</html>
