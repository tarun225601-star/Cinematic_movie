<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Auto Cinematic 4K Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background-color: #030712; color: #f9fafb; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        .container { width: 100%; max-width: 650px; background: #0b0f19; border-radius: 20px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border: 1px solid #1e293b; position: relative; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #1e293b; padding-bottom: 12px; }
        .header-title-area { display: flex; align-items: center; gap: 8px; }
        h1 { font-size: 0.95rem; background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; letter-spacing: 0.5px; }
        
        .header-right { display: flex; align-items: center; gap: 8px; }
        .pro-badge { background: #1e293b; border: 1px solid #334155; color: #38bdf8; font-size: 0.65rem; padding: 4px 10px; border-radius: 20px; font-weight: 900; text-transform: uppercase; }
        
        /* Corner Setting Icon */
        .settings-btn { background: #1e293b; border: 1px solid #334155; color: #f9fafb; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .settings-btn:hover { background: #334155; border-color: #38bdf8; }

        /* Modal Overlay for Settings */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 15px; }
        .modal-content { background: #0b0f19; border: 1px solid #334155; border-radius: 16px; width: 100%; max-width: 400px; padding: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.9); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        .modal-header h3 { font-size: 0.9rem; color: #38bdf8; font-weight: 800; text-transform: uppercase; }
        .close-modal { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }
        
        .modal-group { margin-bottom: 12px; }
        .modal-group label { display: block; font-size: 0.72rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .modal-input, .modal-select { width: 100%; background: #030712; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; color: #fff; font-size: 0.82rem; outline: none; }
        .modal-save-btn { width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }

        .upload-box { border: 2px dashed #334155; border-radius: 14px; padding: 25px 15px; text-align: center; cursor: pointer; background: #0f172a; margin-bottom: 15px; transition: 0.3s; }
        .upload-box:hover { border-color: #38bdf8; background: #131c31; }
        
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 9/16; max-height: 340px; background: #000; border-radius: 14px; overflow: hidden; margin-bottom: 15px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.9); border: 1px solid #1e293b; margin-left: auto; margin-right: auto; }
        video, canvas { width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0; }
        
        .letterbox-top, .letterbox-bottom { position: absolute; left: 0; width: 100%; background: #000; z-index: 10; pointer-events: none; transition: height 0.2s ease-out; }
        .letterbox-top { top: 0; height: 0%; }
        .letterbox-bottom { bottom: 0; height: 0%; }

        /* All Tools Panel */
        .controls-panel { background: #0f172a; border: 1px solid #1e293b; border-radius: 14px; padding: 14px; margin-bottom: 15px; display: none; max-height: 280px; overflow-y: auto; }
        .controls-panel::-webkit-scrollbar { width: 5px; }
        .controls-panel::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .section-title { font-size: 0.72rem; color: #38bdf8; margin-bottom: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        
        .control-group { margin-bottom: 12px; }
        .control-group label { display: flex; justify-content: space-between; font-size: 0.78rem; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
        .control-group label span:last-child { color: #38bdf8; font-family: monospace; }
        
        .control-group input[type="range"] { width: 100%; height: 5px; background: #1e293b; border-radius: 5px; outline: none; -webkit-appearance: none; accent-color: #38bdf8; cursor: pointer; }
        .control-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #38bdf8; cursor: pointer; }

        .btn-group { display: flex; gap: 8px; margin-bottom: 10px; }
        .action-btn { flex: 1; background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 700; cursor: pointer; text-align: center; transition: 0.2s; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
        .action-btn:hover { opacity: 0.95; }
        
        .render-btn { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
        
        .status-box { font-size: 0.78rem; color: #94a3b8; text-align: center; margin-top: 8px; font-weight: 500; background: #030712; padding: 8px; border-radius: 8px; border: 1px solid #1e293b; }
        .download-link-btn { display: none; width: 100%; background: linear-gradient(135deg, #0284c7, #0369a1); color: white; text-decoration: none; padding: 12px; border-radius: 10px; font-weight: 700; text-align: center; margin-top: 10px; box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header with Corner Settings Icon -->
        <div class="header">
            <div class="header-title-area">
                <h1>AI AUTO CINEMATIC 4K</h1>
            </div>
            <div class="header-right">
                <div class="pro-badge">PRO AI</div>
                <button class="settings-btn" onclick="toggleSettingsModal(true)" title="API Settings">⚙️</button>
            </div>
        </div>

        <!-- Settings Modal Popup -->
        <div class="modal-overlay" id="settings-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>⚙️ API & Model Settings</h3>
                    <button class="close-modal" onclick="toggleSettingsModal(false)">✕</button>
                </div>
                <div class="modal-group">
                    <label>🔑 Grok / Llama API Key</label>
                    <input type="password" id="modal-api-key" class="modal-input" placeholder="अपनी API की यहाँ दर्ज करें...">
                </div>
                <div class="modal-group">
                    <label>🧠 Select Model</label>
                    <select id="modal-model-select" class="modal-select">
                        <option value="llama-3-70b" selected>Llama-3-70b (Active)</option>
                        <option value="grok-3">Grok-3</option>
                        <option value="grok-4.3">Grok 4.3</option>
                    </select>
                </div>
                <button class="modal-save-btn" onclick="saveSettingsAndClose()">💾 Save Settings</button>
            </div>
        </div>

        <div class="upload-box" id="upload-trigger" onclick="document.getElementById('file-input').click()">
            <div style="font-size: 1.8rem; margin-bottom: 8px;">🎬</div>
            <div style="color: #cbd5e1; font-weight: 600; font-size: 0.88rem;">वीडियो अपलोड करें (ऑटो-मैजिक के लिए)</div>
            <input type="file" id="file-input" accept="video/*" style="display: none;">
        </div>

        <div class="video-wrapper" id="video-wrapper">
            <div class="letterbox-top" id="lb-top"></div>
            <video id="source-video" crossorigin="anonymous" playsinline muted style="display:none;"></video>
            <canvas id="output-canvas"></canvas>
            <div class="letterbox-bottom" id="lb-bottom"></div>
        </div>

        <!-- All-in-One Video Editing Tools Panel -->
        <div class="controls-panel" id="manual-controls">
            <div class="section-title">🎛️ Master Editing Tools Suite</div>
            
            <div class="control-group">
                <label><span>⚡ Exposure (ब्राइटनेस)</span><span id="val-exposure">100%</span></label>
                <input type="range" id="range-exposure" min="0" max="200" value="100" step="1" oninput="updateValues()">
            </div>

            <div class="control-group">
                <label><span>🌓 Contrast (कंट्रास्ट)</span><span id="val-contrast">100%</span></label>
                <input type="range" id="range-contrast" min="0" max="200" value="100" step="1" oninput="updateValues()">
            </div>

            <div class="control-group">
                <label><span>🎨 Saturation (रंग चटखपन)</span><span id="val-saturation">100%</span></label>
                <input type="range" id="range-saturation" min="0" max="200" value="100" step="1" oninput="updateValues()">
            </div>

            <div class="control-group">
                <label><span>🌡️ Temperature (कलर टोन)</span><span id="val-temp">0</span></label>
                <input type="range" id="range-temp" min="-50" max="50" value="0" step="1" oninput="updateValues()">
            </div>

            <div class="control-group">
                <label><span>🔄 Hue Rotate (कलर शिफ्ट)</span><span id="val-hue">0°</span></label>
                <input type="range" id="range-hue" min="0" max="360" value="0" step="1" oninput="updateValues()">
            </div>

            <div class="control-group">
                <label><span>🌫️ Blur Filter (ब्लर इफेक्ट)</span><span id="val-blur">0px</span></label>
                <input type="range" id="range-blur" min="0" max="10" value="0" step="0.5" oninput="updateValues()">
            </div>

            <div class="control-group">
                <label><span>🎞️ Cinematic Letterbox (ब्लैक बार्स)</span><span id="val-letterbox">10%</span></label>
                <input type="range" id="range-letterbox" min="0" max="25" value="10" step="1" oninput="updateValues()">
            </div>

            <div class="control-group">
                <label><span>⏩ Video Playback Speed</span><span id="val-speed">1.0x</span></label>
                <input type="range" id="range-speed" min="0.5" max="2.0" value="1.0" step="0.1" oninput="updateSpeed()">
            </div>
        </div>

        <div id="controls-section" style="display: none;">
            <div class="btn-group">
                <button class="action-btn" onclick="togglePlay()">▶ Play / Pause</button>
                <button class="action-btn render-btn" id="record-btn" onclick="startVIPExport()">🔴 Export 30s VIP Reel</button>
            </div>

            <div class="status-box" id="status-text">⚡ Llama 3.70B स्टूडियो तैयार है। वीडियो अपलोड करें।</div>

            <a href="#" class="download-link-btn" id="download-btn" download="cinematic_master_reel.webm">⬇️ Download Master Reel</a>
        </div>
    </div>

    <script>
        let selectedFile = null;
        let mediaRecorder;
        let recordedChunks = [];
        let renderTimer = null;

        const fileInput = document.getElementById('file-input');
        const uploadTrigger = document.getElementById('upload-trigger');
        const videoWrapper = document.getElementById('video-wrapper');
        const sourceVideo = document.getElementById('source-video');
        const canvas = document.getElementById('output-canvas');
        const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
        
        const controlsSection = document.getElementById('controls-section');
        const manualControls = document.getElementById('manual-controls');
        const statusText = document.getElementById('status-text');
        const downloadBtn = document.getElementById('download-btn');
        const recordBtn = document.getElementById('record-btn');

        const lbTop = document.getElementById('lb-top');
        const lbBottom = document.getElementById('lb-bottom');

        let expVal = 100, conVal = 100, satVal = 100, tempVal = 0, hueVal = 0, blurVal = 0, lbVal = 10;

        // Load API settings on start
        window.onload = () => {
            const savedKey = localStorage.getItem('grok_llama_api_key');
            const savedModel = localStorage.getItem('grok_llama_selected_model');
            if (savedKey) document.getElementById('modal-api-key').value = savedKey;
            if (savedModel) document.getElementById('modal-model-select').value = savedModel;
        };

        function toggleSettingsModal(show) {
            document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
        }

        function saveSettingsAndClose() {
            const apiKey = document.getElementById('modal-api-key').value.trim();
            const selectedModel = document.getElementById('modal-model-select').value;
            
            if (!apiKey) {
                alert("⚠️ कृपया अपनी API की दर्ज करें!");
                return;
            }

            localStorage.setItem('grok_llama_api_key', apiKey);
            localStorage.setItem('grok_llama_selected_model', selectedModel);
            
            toggleSettingsModal(false);
            alert("✓ API Key और Model सफलतापूर्वक सेव हो गए!");
        }

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const tempVideo = document.createElement('video');
                tempVideo.src = URL.createObjectURL(file);
                tempVideo.onloadedmetadata = () => {
                    selectedFile = file;
                    sourceVideo.src = tempVideo.src;
                    sourceVideo.load();
                    
                    sourceVideo.onloadedmetadata = () => {
                        canvas.width = sourceVideo.videoWidth || 1080;
                        canvas.height = sourceVideo.videoHeight || 1920;
                        
                        uploadTrigger.style.display = 'none';
                        videoWrapper.style.display = 'block';
                        manualControls.style.display = 'block';
                        controlsSection.style.display = 'block';
                        
                        statusText.innerText = "⚡ Llama 3.70B ऑटो-सिनेमैटिक ग्रेडिंग एक्टिव है!";
                        updateValues();
                        renderLoop();
                    };
                };
            }
        };

        function updateValues() {
            expVal = document.getElementById('range-exposure').value;
            conVal = document.getElementById('range-contrast').value;
            satVal = document.getElementById('range-saturation').value;
            tempVal = document.getElementById('range-temp').value;
            hueVal = document.getElementById('range-hue').value;
            blurVal = document.getElementById('range-blur').value;
            lbVal = document.getElementById('range-letterbox').value;

            document.getElementById('val-exposure').innerText = expVal + '%';
            document.getElementById('val-contrast').innerText = conVal + '%';
            document.getElementById('val-saturation').innerText = satVal + '%';
            document.getElementById('val-temp').innerText = tempVal;
            document.getElementById('val-hue').innerText = hueVal + '°';
            document.getElementById('val-blur').innerText = blurVal + 'px';
            document.getElementById('val-letterbox').innerText = lbVal + '%';

            lbTop.style.height = lbVal + '%';
            lbBottom.style.height = lbVal + '%';
        }

        function updateSpeed() {
            const speed = document.getElementById('range-speed').value;
            sourceVideo.playbackRate = parseFloat(speed);
            document.getElementById('val-speed').innerText = speed + 'x';
        }

        function togglePlay() {
            if (sourceVideo.paused) {
                sourceVideo.currentTime = 0;
                sourceVideo.play();
            } else {
                sourceVideo.pause();
            }
        }

        function renderLoop() {
            if (sourceVideo.readyState >= 2) {
                ctx.save();
                let sepiaVal = tempVal > 0 ? tempVal * 0.6 : 0;
                let finalHue = tempVal < 0 ? (tempVal * 1.5) + parseInt(hueVal) : parseInt(hueVal);
                ctx.filter = `brightness(${expVal}%) contrast(${conVal}%) saturate(${satVal}%) sepia(${sepiaVal}%) hue-rotate(${finalHue}deg) blur(${blurVal}px)`;
                ctx.drawImage(sourceVideo, 0, 0, canvas.width, canvas.height);
                ctx.restore();
            }
            requestAnimationFrame(renderLoop);
        }

        function startVIPExport() {
            sourceVideo.currentTime = 0;
            sourceVideo.play();
            
            recordedChunks = [];
            const stream = canvas.captureStream(60); 
            
            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9', videoBitsPerSecond: 15000000 });
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream); 
            }

            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                downloadBtn.href = URL.createObjectURL(blob);
                downloadBtn.style.display = 'block';
                statusText.innerText = "👑 Master रेंडर सफल! रील तैयार है।";
                recordBtn.innerText = "🔴 Export 30s VIP Reel";
                recordBtn.style.background = "linear-gradient(135deg, #10b981, #059669)";
            };

            mediaRecorder.start();
            statusText.innerText = "⏳ 30s VIP रेंडरिंग जारी है...";
            recordBtn.innerText = "⏹️ Processing...";
            recordBtn.style.background = "linear-gradient(135deg, #ef4444, #dc2626)";

            let renderSeconds = 0;
            if (renderTimer) clearInterval(renderTimer);
            
            renderTimer = setInterval(() => {
                renderSeconds++;
                statusText.innerText = `⏳ 30s रेंडरिंग... (${renderSeconds}s / 30s)`;
                
                if (renderSeconds >= 30 || sourceVideo.ended || sourceVideo.currentTime >= 30) {
                    clearInterval(renderTimer);
                    if (mediaRecorder && mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                    }
                    sourceVideo.pause();
                }
            }, 1000);

            sourceVideo.onended = () => {
                clearInterval(renderTimer);
                if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
            };

            recordBtn.onclick = () => {
                clearInterval(renderTimer);
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                    sourceVideo.pause();
                }
            };
        }
    </script>
</body>
</html>
